name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The viewer reads entity-graph.json / metamodel.svg / metamodel.puml
      # from public/data/ at runtime. Those files are owned by the
      # `sync-from-dea-metamodel.yml` workflow — they are .gitignore'd
      # for hand-edits and only present on the branch after that bot runs.
      # On PR branches the bot has not committed yet, so we download the
      # canonical artefacts directly from technehub-labs/dea-metamodel@main
      # via the GitHub API's download_url (which includes a signed token
      # that bypasses raw.githubusercontent.com's caching layer) and stage
      # them into public/data/ just for this CI run. On main the files are
      # already committed and this is a no-op.
      - name: Ensure synced artefacts are present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p public/data
          missing=0
          for entry in \
            "entity-graph.json|viewer/entity-graph.json" \
            "metamodel.svg|viewer/metamodel.svg" \
            "metamodel.puml|metamodel-puml/metamodel-v2.puml"; do
            f="${entry%|*}"
            src="${entry#*|}"
            dst="public/data/$f"
            if [ ! -s "$dst" ]; then
              echo "::warning::$dst missing in working tree — fetching from dea-metamodel@main for CI"
              url=$(gh api "repos/technehub-labs/dea-metamodel/contents/$src?ref=main" --jq '.download_url')
              if [ -z "$url" ] || [ "$url" = "null" ]; then
                echo "::error::Could not resolve download URL for $src"
                exit 1
              fi
              if ! curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$dst"; then
                echo "::error::Failed to download $url"
                exit 1
              fi
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::notice::Synced artefacts fetched from dea-metamodel@main for CI build only. They will be replaced by the sync bot on merge."
          fi
          for f in public/data/entity-graph.json public/data/metamodel.svg public/data/metamodel.puml; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty synced artefact: $f"
              exit 1
            fi
          done
          echo "OK — synced artefacts present"
          python3 -c "import json; d=json.load(open('public/data/entity-graph.json')); print(f'entity-graph.json: {d[\"metamodel_version\"]} ({len(d[\"entities\"])} entities)')"
          echo "metamodel.svg: $(wc -c < public/data/metamodel.svg) bytes"

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Build (vite build)
        run: npm run build

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dea-web-viewer-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error