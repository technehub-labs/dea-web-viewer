name: Sync visualization profile from technehub-labs/dea-metamodel

# Mirrors the canonical presentation-hints profile
# (dea-metamodel/visualization/profile/visualization.yaml, CR-8 §47-§48)
# into public/data/visualization/ on this viewer, so the UI consumes the
# spec-defined group colors/labels/edge styles instead of hardcoding
# them. Dependency direction (§67): specification → … → viewer — the
# viewer never defines presentation semantics.
#
# The sync is *one-way*: dea-metamodel is authoritative. Hand-edits to
# public/data/visualization/ are overwritten on the next sync — same
# semantics as the entity-graph and maturity syncs.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'technehub-labs/dea-metamodel ref to sync from (branch or tag)'
        required: false
        default: 'main'
        type: string
  push:
    branches: [main]
    paths:
      - 'public/data/visualization/**'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dea-web-viewer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect hand-edits to public/data/visualization
        id: detect
        run: |
          if git log -1 --name-only --pretty=format: | \
                grep -E '^public/data/visualization/' > /dev/null; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Hand-edits to public/data/visualization/ detected. Sync will overwrite."
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -n "${{ github.event.inputs.ref }}" ]; then
            REF="${{ github.event.inputs.ref }}"
          else
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Syncing from technehub-labs/dea-metamodel@$REF"

      - name: Fetch canonical visualization profile
        run: |
          set -euo pipefail
          REF="${{ steps.ref.outputs.ref }}"
          mkdir -p public/data/visualization
          url="https://raw.githubusercontent.com/technehub-labs/dea-metamodel/${REF}/visualization/profile/visualization.yaml"
          dst="public/data/visualization/visualization.yaml"
          echo "Fetching $url -> $dst"
          if ! curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$dst"; then
            echo "::error::Failed to fetch $url"
            exit 1
          fi
          ls -la public/data/visualization/

      - name: Validate visualization profile structure
        run: |
          python3 - <<'PY'
          import yaml, sys
          from pathlib import Path
          p = Path("public/data/visualization/visualization.yaml")
          try:
              data = yaml.safe_load(p.read_text())
          except Exception as e:
              print(f"::error::visualization.yaml parse failed: {e}")
              sys.exit(1)
          for key in ("version", "groups", "icons", "edge_styles"):
              if key not in data:
                  print(f"::error::visualization.yaml missing top-level '{key}'")
                  sys.exit(1)
          groups = data["groups"]
          if not isinstance(groups, dict) or len(groups) < 5:
              print(f"::error::visualization.yaml groups malformed ({groups})")
              sys.exit(1)
          print(f"OK — visualization.yaml v{data['version']}, {len(groups)} groups, "
                f"{len(data['icons'])} icons, {len(data['edge_styles'])} edge styles")
          PY

      - name: Configure git
        run: |
          git config user.name  "dea-viz-sync-bot"
          git config user.email "[email protected]"

      - name: Check if artefacts changed
        id: diff
        run: |
          git add public/data/visualization/
          if git diff --cached --quiet -- public/data/visualization/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Visualization profile identical to committed copy — no commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Visualization profile differs — will commit."
          fi

      - name: Commit + push synced artefacts
        if: steps.diff.outputs.changed == 'true'
        run: |
          git commit -m "chore(sync): pull visualization profile from dea-metamodel@main

          Auto-generated by .github/workflows/sync-viz-profile-from-dea-metamodel.yml.
          Pulls the canonical presentation-hints profile (CR-8 §47-§48) so the
          viewer consumes spec-defined group colors/labels instead of hardcoding.

          src/lib/viz-profile-loader.ts asserts drift against the inlined
          canonical literal; on mismatch the loader falls back to the canonical."
          git push
          echo "Pushed synced visualization profile."

      - name: Trigger Pages deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo "Dispatched deploy-pages.yml for the viz-profile sync commit."
